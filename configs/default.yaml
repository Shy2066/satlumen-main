experiment:
  seeds: [42, 2024, 2025]
dataset:
  data_dir: npz_dataset
  train_file: train.npz
  val_file: valid.npz
representation:
  kind: directional_count
  cache_schema: directional_count
  seq_len: 5000
  maximum_load_time: 120
  max_matrix_len: 2700
  log_transform: true
model:
  name: satlumen_conv_classifier
  count_dim: 256
  count_dilations: [1, 2, 4]
  temporal_dilations: [1, 2, 4, 1, 2, 4]
  dropout: 0.1
  pooling: masked_gated_mean_max
training:
  epochs: 100
  batch_size: 64
  lr: 0.001
  min_lr: 0.000001
  weight_decay: 0.05
  warmup_epochs: 5
  num_workers: 4
augmentation:
  mode: global_time_scale
  probability: 0.35
  min_scale: 0.85
loss:
  label_smoothing: 0.1
profiles:
  validation_candidate:
    experiment:
      name: satlumen_directional_count_candidate
      stage: validation_candidate
    logging:
      log_dir: logs/directional_count
      checkpoint_dir: checkpoints/directional_count/candidate
  formal_frozen:
    experiment:
      name: satlumen_directional_count_formal_frozen
      stage: formal_frozen
    dataset:
      test_file: test.npz
    logging:
      log_dir: logs/directional_count/formal
      checkpoint_dir: checkpoints/directional_count/formal
